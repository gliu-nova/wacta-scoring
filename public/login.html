<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-slate-50 min-h-screen">
<div id="app"></div>
<script type="module">
import { api, page, alert } from "/js/ui.js";
page("Login", `<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl border shadow">
  <h1 class="text-2xl font-bold mb-6 text-center">Login</h1>
  <div id="msg" hidden></div>
  <form id="form" class="space-y-4">
    <div><label class="text-sm font-medium">Username</label><input name="username" required class="w-full border rounded-lg px-3 py-2 mt-1"></div>
    <div><label class="text-sm font-medium">Password</label><input name="password" type="password" required class="w-full border rounded-lg px-3 py-2 mt-1"></div>
    <button class="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium hover:bg-emerald-700">Sign In</button>
  </form>
</div>`, "");
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const u = await api("/auth/login", { method: "POST", body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") }) });
    const next = new URLSearchParams(location.search).get("next");
    location.href = next || (u.role === "admin" ? "/admin.html" : "/enter.html");
  } catch (err) { alert(document.getElementById("msg"), err.message); }
};
</script></body></html>
