<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50"><div id="app"></div>
<script type="module">
import { api, getUser, page, esc, alert } from "/js/ui.js";
const id = new URLSearchParams(location.search).get("id");
const [data, user] = await Promise.all([api("/matches/"+id), getUser()]);
const m = data.match;
const loginUrl = `/login.html?next=${encodeURIComponent("/scores.html?id=" + id)}`;

if (!user) {
  page("Scores", `<a href="/match.html?id=${id}" class="text-emerald-600 text-sm">← Match</a>
  <div class="mt-8 bg-amber-50 border border-amber-200 p-6 rounded-xl text-center">
    <p class="mb-4">Log in to enter or edit scores.</p>
    <a href="${loginUrl}" class="inline-block bg-emerald-600 text-white px-6 py-2 rounded-lg">Log In</a>
  </div>`, "Enter Results");
} else {
  page("Scores", `<a href="/match.html?id=${id}" class="text-emerald-600 text-sm">← Match</a>
  <h1 class="text-2xl font-bold my-2">Enter Scores</h1>
  <p class="text-slate-500 mb-4">${esc(m.home_name)} vs ${esc(m.away_name)} · ${m.match_date}</p>
  <div id="msg" hidden></div><form id="form" class="space-y-4"></form>
  <button form="form" class="mt-4 bg-emerald-600 text-white px-6 py-2 rounded-lg hover:bg-emerald-700">Save Scores</button>`, "Enter Results");
  const setInputs = (line, r, n) => `<div class="grid grid-cols-4 gap-2 text-sm items-center"><span>Set ${n}</span>
    <input name="h${n}_${line.id}" type="number" min="0" max="7" value="${r?.["home_set"+n]??0}" class="border rounded px-2 py-1" required>
    <input name="a${n}_${line.id}" type="number" min="0" max="7" value="${r?.["away_set"+n]??0}" class="border rounded px-2 py-1" required>
    <div class="flex gap-1"><input name="htb${n}_${line.id}" placeholder="TB" value="${r?.["home_tb"+n]??""}" class="border rounded px-1 py-1 w-12 text-xs">
    <input name="atb${n}_${line.id}" placeholder="TB" value="${r?.["away_tb"+n]??""}" class="border rounded px-1 py-1 w-12 text-xs"></div></div>`;
  document.getElementById("form").innerHTML = data.lineData.map(({line,result:r}) =>
    `<div class="bg-white p-4 rounded-xl border"><h3 class="font-semibold mb-3">${esc(line.name)}</h3>
    ${setInputs(line,r,1)}${setInputs(line,r,2)}<div class="grid grid-cols-4 gap-2 text-sm items-center mt-2"><span>Set 3</span>
    <input name="h3_${line.id}" type="number" min="0" max="7" value="${r?.home_set3??""}" class="border rounded px-2 py-1" placeholder="—">
    <input name="a3_${line.id}" type="number" min="0" max="7" value="${r?.away_set3??""}" class="border rounded px-2 py-1" placeholder="—">
    <div class="flex gap-1"><input name="htb3_${line.id}" placeholder="TB" value="${r?.home_tb3??""}" class="border rounded px-1 py-1 w-12 text-xs">
    <input name="atb3_${line.id}" placeholder="TB" value="${r?.away_tb3??""}" class="border rounded px-1 py-1 w-12 text-xs"></div></div></div>`).join("");
  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault(); const fd = new FormData(e.target);
    const scores = data.lineData.map(({line}) => ({
      match_line_id: line.id,
      home_set1:+fd.get("h1_"+line.id), away_set1:+fd.get("a1_"+line.id), home_tb1:fd.get("htb1_"+line.id)||undefined, away_tb1:fd.get("atb1_"+line.id)||undefined,
      home_set2:+fd.get("h2_"+line.id), away_set2:+fd.get("a2_"+line.id), home_tb2:fd.get("htb2_"+line.id)||undefined, away_tb2:fd.get("atb2_"+line.id)||undefined,
      home_set3:fd.get("h3_"+line.id)||undefined, away_set3:fd.get("a3_"+line.id)||undefined, home_tb3:fd.get("htb3_"+line.id)||undefined, away_tb3:fd.get("atb3_"+line.id)||undefined,
    }));
    try { await api("/matches/"+id+"/scores",{method:"PUT",body:JSON.stringify({scores})}); location.href="/match.html?id="+id; }
    catch(err) { alert(document.getElementById("msg"), err.message); }
  };
}
</script></body></html>
