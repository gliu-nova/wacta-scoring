<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50"><div id="app"></div>
<script type="module">
import { api, getUser, page, esc, alert } from "/js/ui.js";
import { renderLineCards, parseScoresForm } from "/js/score-form.js";
const id = new URLSearchParams(location.search).get("id");
const [data, user] = await Promise.all([api("/matches/"+id), getUser()]);
const m = data.match;
const loginUrl = `/login.html?next=${encodeURIComponent("/scores.html?id=" + id)}`;

if (!user) {
  page("Scores", `<a href="/match.html?id=${id}" class="text-emerald-600 text-sm">← Match</a>
  <div class="mt-8 bg-amber-50 border border-amber-200 p-6 rounded-xl text-center">
    <p class="mb-4">Log in to enter or edit scores.</p>
    <a href="${loginUrl}" class="inline-block bg-emerald-600 text-white px-6 py-2 rounded-lg">Log In</a>
  </div>`, "Enter Match Results");
} else {
  page("Scores", `<a href="/match.html?id=${id}" class="text-emerald-600 text-sm">← Match</a>
  <h1 class="text-2xl font-bold my-2">Edit Scores</h1>
  <p class="text-sm text-slate-500 mb-4">Changes publish immediately and update standings.</p>
  <p class="text-slate-500 mb-4">${esc(m.home_name)} vs ${esc(m.away_name)} · ${m.match_date}</p>
  <div id="msg" hidden></div><form id="form" class="space-y-4">${renderLineCards(data.lineData, m.home_name, m.away_name)}</form>
  <button form="form" class="mt-4 bg-emerald-600 text-white px-6 py-2 rounded-lg hover:bg-emerald-700">Save Scores</button>`, "Enter Match Results");
  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault(); const fd = new FormData(e.target);
    try {
      await api("/matches/"+id+"/scores",{method:"PUT",body:JSON.stringify({scores: parseScoresForm(fd, data.lineData)})});
      location.href="/match.html?id="+id;
    } catch(err) { alert(document.getElementById("msg"), err.message); }
  };
}
</script></body></html>
