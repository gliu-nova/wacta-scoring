<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50"><div id="app"></div>
<script type="module">
import { api, page, esc, downloadCsv } from "/js/ui.js";
import { renderLeagueStandings } from "/js/standings-table.js";

const leagues = (await api("/admin/leagues")).sort((a, b) => a.name.localeCompare(b.name));

page("Standings", `<div class="flex flex-wrap justify-between gap-3 mb-4">
  <h1 class="text-2xl font-bold">Standings</h1>
  <div class="flex flex-wrap gap-2">
    <button id="export-standings" class="px-3 py-2 bg-amber-600 text-white rounded-lg text-sm">Export Standings</button>
    <button id="export-matches" class="px-3 py-2 bg-emerald-600 text-white rounded-lg text-sm">Export Match Results</button>
    <a href="/export.html" class="px-3 py-2 border rounded-lg text-sm hover:bg-white" title="Opens setup instructions on this site — not Google Sheets directly">Google Sheets setup</a>
  </div>
</div>
<div id="tables" class="space-y-8"></div>`, "Standings");

const sections = await Promise.all(leagues.map(async (lg) => ({
  league: lg,
  standings: await api("/standings/" + lg.id),
})));

document.getElementById("tables").innerHTML = sections.map(({ league, standings }) =>
  renderLeagueStandings(league.name, standings)).join("");

document.getElementById("export-standings").onclick = () => {
  for (const lg of leagues) downloadCsv(`/export/standings.csv?league_id=${lg.id}`);
};
document.getElementById("export-matches").onclick = () => downloadCsv("/export/matches.csv");
</script></body></html>
