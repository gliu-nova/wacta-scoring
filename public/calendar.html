<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50"><div id="app"></div>
<script type="module">
import { api, getUser, page, esc } from "/js/ui.js";
const user = await getUser();
const leagues = await api("/admin/leagues");
const now = new Date();
let year = now.getFullYear(), month = now.getMonth()+1, leagueId = "";
page("Calendar", `<div class="flex flex-wrap justify-between items-center gap-3 mb-4">
  <h1 class="text-2xl font-bold" id="title"></h1>
  <div class="flex gap-2"><button id="prev" class="border px-3 py-1 rounded-lg">←</button><button id="next" class="border px-3 py-1 rounded-lg">→</button>
  ${user?.role==="admin"?'<button id="new" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">+ Match</button>':""}</div></div>
<select id="league" class="border rounded-lg px-3 py-2 mb-4"><option value="">All leagues</option>${leagues.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select>
<div id="cal" class="bg-white rounded-xl border"></div>
<div id="modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4"><div class="bg-white p-6 rounded-xl w-full max-w-md" id="mform"></div></div>`, "Calendar");
async function load() {
  document.getElementById("title").textContent = new Date(year,month-1).toLocaleString("default",{month:"long",year:"numeric"});
  const q = `?year=${year}&month=${month}`+(leagueId?`&league_id=${leagueId}`:"");
  const matches = await api("/matches/calendar"+q);
  const byDate = {}; matches.forEach(m => { const day = parseInt(m.match_date.split("-")[2], 10); (byDate[day] ||= []).push(m); });
  const first = new Date(year,month-1,1).getDay();
  const days = new Date(year,month,0).getDate();
  let html = '<div class="grid grid-cols-7 bg-slate-100 text-center text-xs font-medium"><div class="p-2">Sun</div><div class="p-2">Mon</div><div class="p-2">Tue</div><div class="p-2">Wed</div><div class="p-2">Thu</div><div class="p-2">Fri</div><div class="p-2">Sat</div>';
  let d=1;
  for (let i=0;i<6;i++) { html+='<div class="grid grid-cols-7 border-t min-h-[80px]">';
    for (let j=0;j<7;j++) { const cell = i===0&&j<first||d>days ? "" : String(d++);
      const ms = cell ? (byDate[parseInt(cell,10)]||[]) : [];
      html+=`<div class="p-1 border-r text-xs">${cell?`<div class="text-slate-400 mb-1">${cell}</div>`:""}${ms.map(m=>{
        const actions = user ? `<div class="flex gap-1 mt-0.5"><a href="/scores.html?id=${m.id}" class="text-[10px] text-emerald-700 font-medium hover:underline">Scores</a><a href="/lineup.html?id=${m.id}" class="text-[10px] text-blue-700 font-medium hover:underline">Lineup</a></div>` : "";
        return `<a href="/match.html?id=${m.id}" class="block p-1 mb-1 rounded bg-emerald-50 text-emerald-800 border border-emerald-200"><span class="truncate block">${esc(m.home_name)} v ${esc(m.away_name)}</span>${actions}</a>`;
      }).join("")}</div>`; }
    html+='</div>'; if(d>days) break; }
  document.getElementById("cal").innerHTML = html+'</div>';
}
document.getElementById("prev").onclick = () => { month--; if(month<1){month=12;year--;} load(); };
document.getElementById("next").onclick = () => { month++; if(month>12){month=1;year++;} load(); };
document.getElementById("league").onchange = (e) => { leagueId=e.target.value; load(); };
document.getElementById("new")?.addEventListener("click", async () => {
  const [teams] = await Promise.all([api("/admin/teams")]);
  document.getElementById("mform").innerHTML = `<h2 class="font-bold mb-4">Schedule Match</h2>
    <select id="lg" class="w-full border rounded-lg px-3 py-2 mb-2">${leagues.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select>
    <select id="home" class="w-full border rounded-lg px-3 py-2 mb-2">${teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select>
    <select id="away" class="w-full border rounded-lg px-3 py-2 mb-2">${teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select>
    <input id="date" type="date" class="w-full border rounded-lg px-3 py-2 mb-2">
    <input id="loc" placeholder="Location" class="w-full border rounded-lg px-3 py-2 mb-4">
    <button id="save" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">Create</button>`;
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("save").onclick = async () => {
    await api("/matches",{method:"POST",body:JSON.stringify({league_id:Number(document.getElementById("lg").value),home_team_id:Number(document.getElementById("home").value),away_team_id:Number(document.getElementById("away").value),match_date:document.getElementById("date").value,location:document.getElementById("loc").value})});
    document.getElementById("modal").classList.add("hidden"); load();
  };
});
load();
</script></body></html>
