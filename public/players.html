<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50"><div id="app"></div>
<script type="module">
import { api, page, esc } from "/js/ui.js";
page("Player Search", `<h1 class="text-2xl font-bold mb-4">Player Search</h1>
<form id="qform" class="flex gap-2 mb-6 max-w-md"><input name="q" placeholder="Name..." class="border rounded-lg px-4 py-2 flex-1" autofocus>
<button class="bg-emerald-600 text-white px-4 py-2 rounded-lg">Search</button></form><div id="list" class="bg-white rounded-xl border"></div>`, "Players");
document.getElementById("qform").onsubmit = async (e) => {
  e.preventDefault(); const q = new FormData(e.target).get("q");
  const players = await api("/players/search?q="+encodeURIComponent(q));
  document.getElementById("list").innerHTML = players.length ? `<table class="w-full text-sm"><thead class="bg-slate-100"><tr><th class="p-3 text-left">Player</th><th class="p-3">NTRP</th></tr></thead><tbody>${
    players.map(p=>`<tr class="border-t"><td class="p-3"><a href="/player.html?id=${p.id}" class="text-emerald-700 font-medium">${esc(p.first_name)} ${esc(p.last_name)}</a></td><td class="p-3">${p.ntrp_rating.toFixed(1)}</td></tr>`).join("")}</tbody></table>` : `<p class="p-6 text-slate-400 text-center">No players found</p>`;
};
</script></body></html>
