<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50"><div id="app"></div>
<script type="module">
import { api, getUser, page, esc } from "/js/ui.js";
if ((await getUser())?.role !== "admin") location.href="/login.html";
const [teams, leagues] = await Promise.all([api("/admin/teams"), api("/admin/leagues")]);
const lmap = Object.fromEntries(leagues.map(l => [l.id, l.name]));
page("Teams", `<div class="flex justify-between mb-6"><h1 class="text-2xl font-bold">Teams</h1></div>
<div id="list" class="bg-white rounded-xl border mb-6"></div>
<h2 class="font-semibold mb-2">Add Team</h2>
<form id="form" class="flex flex-wrap gap-2 bg-white p-4 rounded-xl border">
<input name="name" required placeholder="Team name" class="border rounded-lg px-3 py-2">
<select name="league_id" class="border rounded-lg px-3 py-2">${leagues.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select>
<button class="bg-emerald-600 text-white px-4 py-2 rounded-lg">Add</button></form>`, "Admin");
function load() {
  document.getElementById("list").innerHTML = `<table class="w-full text-sm"><thead class="bg-slate-100"><tr><th class="p-3 text-left">Team</th><th class="p-3 text-left">League</th><th></th></tr></thead><tbody>${
    teams.map((t,i) => `<tr class="border-t"><td class="p-3 font-medium">${esc(t.name)}</td><td class="p-3 text-slate-500">${esc(lmap[t.league_id])}</td>
    <td class="p-3"><button data-i="${i}" class="text-red-600 text-sm del">Delete</button></td></tr>`).join("")}</tbody></table>`;
  document.querySelectorAll(".del").forEach(b => b.onclick = async () => { await api("/admin/teams/"+teams[b.dataset.i].id,{method:"DELETE"}); teams.splice(b.dataset.i,1); load(); });
}
document.getElementById("form").onsubmit = async (e) => { e.preventDefault(); const fd=new FormData(e.target);
  await api("/admin/teams",{method:"POST",body:JSON.stringify({name:fd.get("name"),league_id:Number(fd.get("league_id"))})});
  teams.push(...await api("/admin/teams")); location.reload(); };
load();
</script></body></html>
