<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50"><div id="app"></div>
<script type="module">
import { api, getUser, page, esc, downloadCsv, alert } from "/js/ui.js";

const user = await getUser();

const leagues = (await api("/admin/leagues")).sort((a, b) => a.name.localeCompare(b.name));

page("Past Match Results", `<div class="flex flex-wrap justify-between gap-3 mb-2">
  <h1 class="text-2xl font-bold">Past Match Results</h1>
  <div class="flex flex-wrap gap-2">
    <button id="export-btn" class="px-3 py-2 bg-emerald-600 text-white rounded-lg text-sm">Export Past Match Results</button>
    <a href="/export.html" class="px-3 py-2 border rounded-lg text-sm hover:bg-white" title="Opens setup instructions on this site — not Google Sheets directly">Google Sheets setup</a>
  </div>
</div>
<p class="text-slate-500 mb-4">Matches with submitted scores only.</p>
<div id="msg" hidden></div>
<select id="league" class="border rounded-lg px-3 py-2 mb-4">
  <option value="">All divisions</option>
  ${leagues.map((l) => `<option value="${l.id}">${esc(l.name)}</option>`).join("")}
</select>
<div id="list" class="bg-white rounded-xl border overflow-hidden"></div>`, "Past Match Results");

async function load() {
  const leagueId = document.getElementById("league").value;
  const q = leagueId ? `?league_id=${leagueId}` : "";
  const matches = await api("/matches/history" + q);
  document.getElementById("list").innerHTML = matches.length
    ? `<table class="w-full text-sm"><thead class="bg-slate-100"><tr>
      <th class="p-3 text-left">Date</th><th class="p-3 text-left">Division</th>
      <th class="p-3 text-left">Match</th>${user ? `<th class="p-3"></th>` : ""}</tr></thead><tbody>${
      matches.map((m) => `<tr class="border-t hover:bg-slate-50">
        <td class="p-3 whitespace-nowrap">${m.match_date}</td>
        <td class="p-3 text-slate-500">${esc(m.league_name)}</td>
        <td class="p-3"><a href="/match.html?id=${m.id}" class="text-emerald-700 font-medium hover:underline">${esc(m.home_name)} vs ${esc(m.away_name)}</a></td>
        ${user ? `<td class="p-3 text-right"><button data-delete="${m.id}" class="text-red-600 text-sm">Delete</button></td>` : ""}</tr>`).join("")
    }</tbody></table>`
    : `<p class="p-8 text-center text-slate-400">No submitted results yet.</p>`;
  document.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.onclick = async () => {
      const row = btn.closest("tr");
      const label = row?.querySelector("a")?.textContent ?? "this match";
      const date = row?.cells[0]?.textContent ?? "";
      if (!confirm(`Delete ${label}${date ? ` on ${date}` : ""}? This removes the result from standings and cannot be undone.`)) return;
      try {
        await api("/matches/" + btn.dataset.delete, { method: "DELETE" });
        await load();
      } catch (err) { alert(document.getElementById("msg"), err.message); }
    };
  });
}

document.getElementById("league").onchange = load;
document.getElementById("export-btn").onclick = () => {
  const leagueId = document.getElementById("league").value;
  downloadCsv(leagueId ? `/export/matches.csv?league_id=${leagueId}` : "/export/matches.csv");
};
load();
</script></body></html>
