<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-slate-50 min-h-screen"><div id="app"></div>
<script type="module">
import { api, getUser, page, downloadCsv } from "/js/ui.js";
const user = await getUser();
if (!user || user.role !== "admin") location.href = "/login.html";
const stats = await api("/admin/stats");
page("Admin", `
  <h1 class="text-2xl font-bold mb-6">Admin Dashboard</h1>
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
    ${[["Leagues",stats.leagues],["Teams",stats.teams],["Players",stats.players],["Matches",stats.matches]].map(([l,n]) =>
      `<div class="bg-white p-5 rounded-xl border"><div class="text-3xl font-bold text-emerald-600">${n}</div><div class="text-slate-500 text-sm">${l}</div></div>`).join("")}
  </div>
  <div class="flex flex-wrap gap-3 mb-8">
    <a href="/approvals.html" class="px-4 py-2 bg-amber-600 text-white rounded-lg">Pending Approvals${stats.pending ? ` (${stats.pending})` : ""}</a>
    <a href="/leagues.html" class="px-4 py-2 bg-emerald-600 text-white rounded-lg">Leagues</a>
    <a href="/teams.html" class="px-4 py-2 bg-emerald-600 text-white rounded-lg">Teams</a>
    <a href="/players-admin.html" class="px-4 py-2 bg-emerald-600 text-white rounded-lg">Players</a>
    <a href="/users.html" class="px-4 py-2 bg-slate-600 text-white rounded-lg">Users</a>
    <a href="/enter.html" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Enter Match Results</a>
  </div>
  <div class="bg-white rounded-xl border p-5">
    <h2 class="font-semibold mb-2">Export Data</h2>
    <p class="text-sm text-slate-500 mb-4">Download CSV files for spreadsheets. Use "Export Everything" for a single file with standings, scores, and players.</p>
    <div class="flex flex-wrap gap-3">
      <button id="export-all" class="px-4 py-2 bg-amber-600 text-white rounded-lg">Export Everything</button>
      <button id="export-matches" class="px-4 py-2 bg-slate-600 text-white rounded-lg">All Matches & Scores</button>
      <button id="export-players" class="px-4 py-2 bg-slate-600 text-white rounded-lg">All Players</button>
    </div>
  </div>`, "Admin");
document.getElementById("export-all").onclick = () => downloadCsv("/export/all.csv");
document.getElementById("export-matches").onclick = () => downloadCsv("/export/matches.csv");
document.getElementById("export-players").onclick = () => downloadCsv("/export/players.csv");
</script></body></html>
