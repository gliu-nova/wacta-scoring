<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>WACTA Scoring</title>
</head><body class="bg-slate-50 min-h-screen">
<div id="app"></div>
<script type="module">
import { api, getUser, page, esc } from "/js/ui.js";
import { renderLeagueStandings } from "/js/standings-table.js";

const user = await getUser();
page("WACTA Scoring", `
  <h1 class="text-2xl font-bold mb-2">Private Tennis League Scoring</h1>
  <p class="text-slate-600 mb-6">Record match results, view standings, and track players.</p>
  <a href="/enter.html" class="block mb-6 p-6 bg-emerald-600 text-white rounded-xl shadow hover:bg-emerald-700">
    <h2 class="text-xl font-bold">Enter Match Results</h2>
    <p class="text-emerald-100 mt-1 text-sm">${user ? "Pick teams and enter scores — publishes immediately" : "Submit scores for admin review before publishing"}</p>
  </a>
  <div class="grid sm:grid-cols-3 gap-4 mb-10" id="cards"></div>
  <h2 class="text-xl font-bold mb-4">Standings</h2>
  <div id="standings" class="space-y-6 mb-10"></div>
  <h2 class="text-xl font-bold mb-4">Recent Changes</h2>
  <div id="activity" class="bg-white rounded-xl border overflow-hidden"></div>`, "Home");

document.getElementById("cards").innerHTML = [
  ["/standings.html", "Standings", "Full standings with export"],
  ["/players.html", "Player Search", "History and stats"],
  ["/calendar.html", "Calendar", "View upcoming matches"],
].map(([h, t, d]) => `<a href="${h}" class="block p-5 bg-white rounded-xl border shadow-sm hover:border-emerald-400">
  <h3 class="font-semibold text-emerald-700">${t}</h3><p class="text-sm text-slate-500 mt-1">${d}</p></a>`).join("");

const leagues = (await api("/admin/leagues")).sort((a, b) => a.name.localeCompare(b.name));
const [standingsSections, activity] = await Promise.all([
  Promise.all(leagues.map(async (lg) => ({ league: lg, standings: await api("/standings/" + lg.id) }))),
  api("/activity/recent?limit=15"),
]);

document.getElementById("standings").innerHTML = standingsSections.map(({ league, standings }) =>
  renderLeagueStandings(league.name, standings)).join("");

function fmtWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso.includes("T") ? iso : iso.replace(" ", "T") + "Z");
  const diff = Date.now() - d.getTime();
  if (diff < 3600000) return `${Math.max(1, Math.floor(diff / 60000))}m ago`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
  return d.toLocaleDateString();
}

document.getElementById("activity").innerHTML = activity.length
  ? activity.map((a) => {
      const inner = `<div class="flex flex-wrap justify-between gap-2">
        <span class="font-medium">${esc(a.description)}</span>
        <span class="text-sm text-slate-400 whitespace-nowrap">${fmtWhen(a.created_at)}</span>
      </div>
      ${a.details?.subtitle ? `<div class="text-sm text-amber-700 mt-1">${esc(a.details.subtitle)}</div>` : ""}
      ${a.username ? `<div class="text-xs text-slate-400 mt-1">by ${esc(a.username)}</div>` : ""}`;
      return a.link
        ? `<a href="${esc(a.link)}" class="block p-4 border-b last:border-b-0 hover:bg-slate-50">${inner}</a>`
        : `<div class="p-4 border-b last:border-b-0">${inner}</div>`;
    }).join("")
  : `<p class="p-8 text-center text-slate-400">No recent changes yet.</p>`;
</script></body></html>
