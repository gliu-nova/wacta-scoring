<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>WACTA Scoring</title>
</head><body class="bg-slate-50 min-h-screen">
<div id="app"></div>
<script type="module">
import { api, getUser, page, esc } from "/js/ui.js";
import { renderLeagueStandings } from "/js/standings-table.js";

const user = await getUser();
page("WACTA Scoring", `
  <h1 class="text-2xl font-bold mb-2">Private Tennis League Scoring</h1>
  <p class="text-slate-600 mb-6">Record match results, view standings, and track players.</p>
  <a href="${user ? "/enter.html" : "/login.html?next=%2Fenter.html"}" class="block mb-10 p-6 bg-emerald-600 text-white rounded-xl shadow hover:bg-emerald-700">
    <h2 class="text-xl font-bold">Enter Match Results</h2>
    <p class="text-emerald-100 mt-1 text-sm">${user ? "Pick teams and enter scores" : "Log in to record scores"}</p>
  </a>
  <h2 class="text-xl font-bold mb-4">Standings</h2>
  <div id="standings" class="space-y-6 mb-10"></div>
  <h2 class="text-xl font-bold mb-4">Recent Results</h2>
  <div id="recent" class="bg-white rounded-xl border overflow-hidden"></div>
  <div class="grid sm:grid-cols-3 gap-4 mt-10" id="cards"></div>`, "Home");

const leagues = (await api("/admin/leagues")).sort((a, b) => a.name.localeCompare(b.name));
const [standingsSections, recent] = await Promise.all([
  Promise.all(leagues.map(async (lg) => ({ league: lg, standings: await api("/standings/" + lg.id) }))),
  api("/matches/recent?limit=12"),
]);

document.getElementById("standings").innerHTML = standingsSections.map(({ league, standings }) =>
  renderLeagueStandings(league.name, standings)).join("");

function fmtWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso.includes("T") ? iso : iso.replace(" ", "T") + "Z");
  const diff = Date.now() - d.getTime();
  if (diff < 3600000) return `${Math.max(1, Math.floor(diff / 60000))}m ago`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
  return d.toLocaleDateString();
}

document.getElementById("recent").innerHTML = recent.length
  ? recent.map((m) => `<a href="/match.html?id=${m.id}" class="block p-4 border-b last:border-b-0 hover:bg-slate-50">
      <div class="flex flex-wrap justify-between gap-2">
        <span class="font-medium">${esc(m.home_name)} <span class="text-slate-400">vs</span> ${esc(m.away_name)}</span>
        <span class="text-sm text-slate-500">${esc(m.match_date)}</span>
      </div>
      <div class="text-sm text-slate-500 mt-1">${esc(m.league_name)} · ${m.lines_scored} line${m.lines_scored === 1 ? "" : "s"} scored · Updated ${fmtWhen(m.updated_at)}</div>
    </a>`).join("")
  : `<p class="p-8 text-center text-slate-400">No results yet — be the first to enter a match!</p>`;

document.getElementById("cards").innerHTML = [
  ["/standings.html", "Full Standings", "Detailed view with export"],
  ["/players.html", "Player Search", "History and stats"],
  ["/calendar.html", "Calendar", "View upcoming matches"],
].map(([h, t, d]) => `<a href="${h}" class="block p-5 bg-white rounded-xl border shadow-sm hover:border-emerald-400">
  <h3 class="font-semibold text-emerald-700">${t}</h3><p class="text-sm text-slate-500 mt-1">${d}</p></a>`).join("");
</script></body></html>
